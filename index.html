<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Information Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container py-5">

<div class="card shadow-lg border-0">

<div class="header text-center text-white p-4">

<h2><i class="fa-solid fa-user-graduate"></i>
Student Admission Form</h2>

<p>Please Fill All Required Information</p>

</div>

<div class="card-body p-4">

<form id="studentForm">

<!-- Personal Information -->

<h4 class="title">Personal Information</h4>

<div class="row">

<div class="col-md-4 mb-3">
<label>First Name</label>
<input type="text" class="form-control" id="fname" required>
</div>

<div class="col-md-4 mb-3">
<label>Last Name</label>
<input type="text" class="form-control" id="lname" required>
</div>

<div class="col-md-6 mb-3">
<label>Father Name</label>
<input type="text" class="form-control" id="fatherName" required>
</div>

<div class="col-md-4 mb-3">
<label>Date of Birth</label>
<input type="date" class="form-control" id="dob">
</div>

<div class="col-md-4 mb-3">
<label>Age</label>
<input type="number" class="form-control" id="age">
</div>

<div class="col-md-4 mb-3">

<label>Gender</label>

<div class="mt-2">

<input type="radio" name="gender" value="Male">
Male

<input type="radio" name="gender" value="Female" class="ms-3">
Female

</div>

</div>

<!-- School Information -->

<h4 class="title mt-4">School Information</h4>

<div class="col-md-6 mb-3">

<label>Roll Number</label>

<input type="text" class="form-control" id="rollNumber">

</div>

<div class="col-md-6 mb-3">

<label>Class</label>

<select class="form-select" id="class">

<option>Select Class</option>

<option>Play Group</option>

<option>Nursery</option>

<option>KG</option>

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5</option>

<option>6</option>

<option>7</option>

<option>8</option>

<option>9</option>

<option>10</option>

<option>11</option>

<option>12</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>School Name</label>

<input type="text" class="form-control" id="schoolName">

</div>

<div class="col-md-6 mb-3">

<label>Section</label>

<select class="form-select" id="section">

<option>A</option>

<option>B</option>

<option>C</option>

<option>D</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Admission Date</label>

<input type="date" class="form-control" id="admissionDate">

</div>

<!-- Contact -->

<h4 class="title mt-4">Contact Information</h4>

<div class="col-md-6 mb-3">

<label>Email Address</label>

<input type="email" class="form-control" id="email">

</div>

<div class="col-md-6 mb-3">

<label>Parent Phone Number</label>

<input type="tel" class="form-control" id="parentPhone">

</div>

<div class="col-md-6 mb-3">

<label>City</label>

<input type="text" class="form-control">

</div>

<div class="col-12 mb-3">

<label>Complete Address</label>

<textarea rows="2" class="form-control"></textarea>

</div>

<!-- Additional -->

<h4 class="title mt-4">Additional Information</h4>

</div>

<div class="col-md-4 mb-3">

<label>Nationality</label>

<input type="text" class="form-control" id="nationality">

</div>

<div class="col-md-4 mb-3">

<label>Religion</label>

<input type="text" class="form-control" id="religion">

</div>

<div class="col-md-6 mb-4">

<label>CNIC / B-Form</label>

<input type="text" class="form-control" id="cnic">

</div>

<div class="col-md-6 mb-4">

<label>Student Photo</label>

<input type="file"
class="form-control"
id="photo"
accept="image/*">

<img id="preview"
src=""
class="img-thumbnail mt-3"
width="150">

</div>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-primary px-5">

<i class="fa-solid fa-paper-plane"></i>

Submit

</button>

<button
type="reset"
class="btn btn-danger px-5 ms-3">

Reset

</button>

</div>

</form>

</div>

</div>

</div>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
